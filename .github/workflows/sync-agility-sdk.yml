name: Sync DirectX 12 Agility SDK

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: agility-sdk-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest stable Agility SDK
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');

            const PACKAGE = 'microsoft.direct3d.d3d12';
            const API = `https://nuget.org{PACKAGE}`;
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();

            // 1. Fetch the single latest stable version from NuGet
            const res = await fetch(`${API}/index.json`);
            if (!res.ok) throw new Error(`Failed to fetch NuGet index: ${res.status}`);
            const { versions } = await res.json();

            const compareSemver = (a, b) => {
              const pa = a.split('.').map(Number);
              const pb = b.split('.').map(Number);
              for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const diff = (pb[i] || 0) - (pa[i] || 0);
                if (diff !== 0) return diff;
              }
              return 0;
            };

            const latestVersion = versions
              .filter(v => !v.includes('-'))
              .sort(compareSemver)[0];

            if (!latestVersion) {
              throw new Error('Could not resolve any stable version from NuGet.');
            }

            // 2. Check if the latest version already exists in commit history
            const existingCommits = new Set(git('log', '--format=%s').split(/\r?\n/).filter(Boolean));
            if (existingCommits.has(latestVersion)) {
              core.info(`Already up to date (latest stable: ${latestVersion}).`);
              return;
            }

            core.info(`Found new latest version: ${latestVersion}`);

            // 3. Clean repository root except .git and .github
            for (const entry of fs.readdirSync('.')) {
              if (entry === '.git' || entry === '.github') continue;
              fs.rmSync(entry, { recursive: true, force: true });
            }

            // 4. Download NuGet package directly into repo root, unzip, and delete .nupkg
            const nupkgFile = `${PACKAGE}.${latestVersion}.nupkg`;
            const pkgRes = await fetch(`${API}/${latestVersion}/${nupkgFile}`);
            if (!pkgRes.ok) throw new Error(`Failed to download package ${latestVersion}: ${pkgRes.status}`);

            fs.writeFileSync(nupkgFile, Buffer.from(await pkgRes.arrayBuffer()));
            execFileSync('unzip', ['-q', '-o', nupkgFile, '-d', '.']);
            fs.rmSync(nupkgFile, { force: true });

            // 5. Commit and push
            git('config', 'user.name', 'github-actions[bot]');
            git('config', 'user.email', '41898282+github-actions[bot]@://github.com');
            git('add', '-A');

            if (!git('status', '--porcelain')) {
              core.info(`No file changes detected for ${latestVersion}.`);
              return;
            }

            git('commit', '-m', latestVersion, '-m', 'Sync Microsoft.Direct3D.D3D12 NuGet package.');
            git('push', 'origin', 'HEAD');

            core.info(`Successfully synchronized DirectX 12 Agility SDK ${latestVersion}`);
